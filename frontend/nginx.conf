# nginx config for SPA — fall back to index.html for client-side routing
# Unprivileged: listens on 8080 (non-root can't bind <1024); the Caddy
# TLS proxy and the compose port mapping point at this port.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version
    server_tokens off;

    # ── Security headers ─────────────────────────
    # HSTS is ignored by browsers over plain HTTP and takes effect once
    # the TLS reverse proxy (Caddy, see docker-compose.prod.yml) is in
    # front of this container.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app is fully self-hosted (no CDNs/external fonts) and talks to
    # the API same-origin via the /api/ proxy below. 'unsafe-inline' for
    # styles is needed for React's inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
