# ── Unprivileged nginx main config ────────────
# The official nginx:alpine image compiles with temp paths under
# /var/cache/nginx and a pid file in /var/run — both root-owned. Running
# as the image's `nginx` user (uid 101) requires overriding every path
# nginx writes to. Logs go to stdout/stderr (Docker picks them up).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    # Writable temp dirs for the non-root worker processes
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
