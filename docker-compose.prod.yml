# ── Budget App — Production Docker Compose ────
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# This file uses production builds:
#   - Caddy: TLS termination with automatic HTTPS (Let's Encrypt) —
#     set SITE_ADDRESS to your domain to enable it
#   - Backend: uvicorn (no --reload)
#   - Frontend: nginx serving the built static files
#   - PostgreSQL: with persistent volume
#   - Redis: shared rate-limit counters (global across backend workers)
#
# Required environment variables (set in .env or export):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   SECRET_KEY (use a strong random string!)
#   SITE_ADDRESS (e.g., budget.example.com — enables automatic HTTPS)
#   BACKEND_CORS_ORIGINS (e.g., ["https://budget.example.com"])

services:
  # ── PostgreSQL database ─────────────────────
  db:
    image: postgres:16-alpine
    container_name: budget-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Don't expose the DB port to the host in production
    expose:
      - "5432"

  # ── Redis (shared rate-limit counters) ──────
  # Global fixed-window state for all backend workers, so the configured
  # auth limits hold exactly (no per-worker ×4 effective limit). Data is
  # disposable (rate-limit windows only), hence no persistent volume.
  redis:
    image: redis:8-alpine
    container_name: budget-redis-prod
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"

  # ── FastAPI backend (production) ────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget-backend-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    # Run Alembic migrations on startup, then start uvicorn (no --reload)
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend (nginx serving production build) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: budget-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    # Only reachable from the host itself (for smoke tests via curl).
    # All public traffic goes through the Caddy TLS proxy below.
    # The nginx container runs unprivileged and listens on 8080.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    # nginx proxies /api/ to the backend service (see nginx.conf)

  # ── TLS termination (Caddy, automatic HTTPS) ──
  # Public entry point: ports 80 + 443. Set SITE_ADDRESS to your domain
  # and Caddy provisions/renews Let's Encrypt certificates automatically
  # and redirects HTTP → HTTPS. With the default ":80" it serves plain
  # HTTP (local testing only!).
  caddy:
    image: caddy:2-alpine
    container_name: budget-caddy-prod
    restart: always
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates
      - caddy_config:/config  # letsencrypt state

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
